<!doctype html>
<!--
  Smoke-test page for dist/echo-show-dashboard.js with a fake Home Assistant.
  Open test/index.html#weather (or #timers, #media, #notify) in a 1280x800 window,
  or run `node test/smoke.js` (needs Playwright).
-->
<html><head><meta charset="utf-8"><title>Echo Show Dashboard test</title>
<style>html,body{margin:0;background:#000;height:100%}</style>
<script>
// ha-icon stand-in: shows the icon name's initials so the layout is visible without HA.
customElements.define("ha-icon", class extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  connectedCallback() { this.r(); } attributeChangedCallback() { this.r(); }
  r() { var n = (this.getAttribute("icon") || "").replace("mdi:", ""); this.style.cssText += ";box-sizing:border-box;border:2px solid currentColor;border-radius:30%;align-items:center;justify-content:center;font:bold 10px sans-serif;overflow:hidden"; this.textContent = n.split("-").map(function (s) { return s[0]; }).join("").toUpperCase(); }
});
window.errors = [];
window.addEventListener("error", function (e) { errors.push(String(e.message)); });
</script>
<script src="../dist/echo-show-dashboard.js"></script>
</head><body>
<script>
var VIEW = location.hash.slice(1) || "weather";
var TAB = null;
if (/^settings/.test(VIEW)) { TAB = VIEW.split("-")[1] || "general"; VIEW = "weather"; }
// #clock-alarms, #clock-stopwatch, #clock-timers open the Clock card on that tab.
var CLOCK_TAB = null;
if (/^clock/.test(VIEW)) { CLOCK_TAB = VIEW.split("-")[1] || "alarms"; VIEW = "timers"; }
try { localStorage.setItem("echo-display", "Kitchen Echo Show 8"); } catch (e) {}
var THEME = /[?&]theme=([a-z]+)/.exec(location.search);
window.EchoShow.prefs.set("theme", THEME ? THEME[1] : "midnight");
if (CLOCK_TAB) window.EchoShow.prefs.set("clock_tab", CLOCK_TAB);
if (/[?&]noalarms/.test(location.search)) try { localStorage.removeItem("echo-clock-alarms:kitchen echo show 8"); } catch (e) {}
var now = Date.now();
function S(id, state, attrs) { return { entity_id: id, state: state, attributes: attrs || {}, last_updated: new Date().toISOString(), last_changed: new Date().toISOString() }; }
var states = {};
function put(s) { states[s.entity_id] = s; }
put(S("weather.home", "partlycloudy", { temperature: 61, humidity: 72, wind_speed: 6, wind_bearing: 220, pressure: 1016, temperature_unit: "°F", wind_speed_unit: "mph", pressure_unit: "hPa", supported_features: 3, friendly_name: "Home" }));
put(S("sun.sun", "above_horizon", { elevation: 30 }));
put(S("sensor.sun_next_rising", new Date(now + 10 * 3600e3).toISOString()));
put(S("sensor.sun_next_setting", new Date(now + 3 * 3600e3).toISOString()));
put(S("timer.echo_timer_1", "active", { duration: "0:10:00", finishes_at: new Date(now + 312e3).toISOString(), remaining: "0:05:12" }));
put(S("input_text.echo_timer_1_name", "Pasta"));
put(S("timer.echo_timer_2", "paused", { duration: "0:20:00", remaining: "0:14:30" }));
put(S("input_text.echo_timer_2_name", "Bread"));
put(S("timer.echo_timer_3", "idle", { duration: "0:05:00" }));
put(S("input_text.echo_timer_3_name", ""));
put(S("input_select.echo_timer_alarm_tone", "Chime", { options: ["Chime", "Marimba", "Bells"] }));
put(S("input_number.echo_timer_alarm_volume", "80", { min: 10, max: 100, step: 5 }));
var base = { volume_level: 0.35, is_volume_muted: false, supported_features: 8321599 };
put(S("media_player.kitchen", "playing", Object.assign({}, base, { group_members: ["media_player.kitchen"], media_title: "Answer to Your Name", media_artist: "Protoje", media_album_name: "Ancient Future", media_duration: 234, media_position: 81, media_position_updated_at: new Date().toISOString(), entity_picture: "art.jpg" })));
put(S("media_player.living_room", "idle", Object.assign({}, base, { group_members: ["media_player.living_room"] })));
// a Kiosk Satellite display
var D = "kitchen_echo_show_8";
put(S("switch." + D + "_mute", "off", { icon: "mdi:microphone-off" }));
put(S("switch." + D + "_camera_enabled", "on"));
put(S("switch." + D + "_rtsp_streaming", "off"));
put(S("switch." + D + "_screensaver_motion_detection", "on"));
put(S("switch." + D + "_screensaver_face_detection", "off"));
put(S("sun.sun", "above_horizon", { elevation: 30 }));
put(S("switch." + D + "_voice_satellite", "on"));
put(S("switch." + D + "_wake_sound", "on"));
put(S("switch." + D + "_adaptive_brightness", "off"));
put(S("switch." + D + "_keep_screen_on", "on"));
put(S("number." + D + "_volume", "40", { min: 0, max: 100 }));
put(S("number." + D + "_assistant_volume", "100", { min: 0, max: 100 }));
put(S("number." + D + "_media_volume", "45", { min: 0, max: 100 }));
put(S("number." + D + "_screensaver_timeout", "300"));
put(S("select." + D + "_screensaver_mode", "Clock", { options: ["Dim", "Black", "Clock", "Weather Mood", "Home Assistant Media", "Photo Gallery"] }));
put(S("select." + D + "_wake_word_sensitivity", "Moderately sensitive", { options: ["Slightly sensitive", "Moderately sensitive", "Very sensitive"] }));
put(S("light." + D + "_screen", "on", { brightness: 153 }));
put(S("sensor." + D + "_battery", "100.0"));
put(S("sensor." + D + "_cpu_temperature", "61.0", { unit_of_measurement: "°C" }));
put(S("sensor." + D + "_ipv4_address", "192.0.2.22"));
put(S("sensor." + D + "_android_version", "Android 11"));
put(S("sensor." + D + "_ram_available", "717.0"));
put(S("update." + D + "_update", "on", { installed_version: "2026.9.92", latest_version: "2026.9.98" }));
put(S("button." + D + "_reload_page", "unknown"));
put(S("button." + D + "_clear_cache", "unknown"));
// Kiosk Satellite alarm entities (with the doubled area prefix HA sometimes gives them)
put(S("binary_sensor.kitchen_" + D + "_alarm_ringing", /[?&]ringing/.test(location.search) ? "on" : "off"));
put(S("sensor.kitchen_" + D + "_alarm_snoozed_until", "unknown"));
put(S("button.kitchen_" + D + "_stop_alarm", "unknown"));
put(S("button.kitchen_" + D + "_snooze_alarm", "unknown"));

// A fake kiosk: answers kiosk_satellite_alarm requests the way Kiosk Satellite does.
var DN = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"], WN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
var kioskAlarms = /[?&]noalarms/.test(location.search) ? [] : [
  { time: "06:30", days: ["mon", "tue", "wed", "thu", "fri"], label: "Work", on: true },
  { time: "08:15", days: ["sat", "sun"], label: "", on: false },
  { time: "13:45", days: [], label: "Pizza out", on: true },
];
function nextRing(a) {
  var p = a.time.split(":"), d = new Date();
  for (var i = 0; i < 8; i++) {
    var c = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i, +p[0], +p[1]);
    if (c > d && (!a.days.length || a.days.indexOf(DN[c.getDay()]) !== -1)) return WN[c.getDay()] + " " + c.toISOString().slice(0, 10) + " " + a.time;
  }
}
function describe(a) { var o = { time: a.time, days: a.days.length ? a.days : "once", on: a.on }; if (a.label) o.label = a.label; if (a.on) o.next_ring = nextRing(a); return o; }
function kiosk(req) {
  var all = kioskAlarms, m = all.filter(function (a) { return (!req.time || a.time === req.time) && (!req.label || a.label.toLowerCase().indexOf(req.label.toLowerCase()) !== -1); });
  if (req.action === "list") return { ok: true, result: "listed", alarms: all.map(describe) };
  if (req.action === "set") { var ex = all.filter(function (a) { return a.time === req.time && a.days.join() === req.days.join(); })[0]; if (ex) { ex.on = true; return { ok: true, result: "already_existed_now_on", alarm: describe(ex) }; } var n = { time: req.time, days: req.days, label: req.label, on: true }; all.push(n); return { ok: true, result: "set", alarm: describe(n) }; }
  if (!m.length) return { ok: false, error: "no matching alarm" };
  if (m.length > 1) return { ok: false, error: "several alarms match, ask which one" };
  if (req.action === "delete") { all.splice(all.indexOf(m[0]), 1); return { ok: true, result: "deleted", alarm: describe(m[0]) }; }
  m[0].on = req.action === "turn_on"; return { ok: true, result: req.action === "turn_on" ? "turned_on" : "turned_off", alarm: describe(m[0]) };
}
var listeners = {};

function forecast(type) {
  var out = [], step = type === "hourly" ? 3600e3 : 86400e3, n = type === "hourly" ? 48 : 7;
  for (var i = 0; i < n; i++) out.push({ datetime: new Date(now + i * step).toISOString(), condition: ["sunny", "partlycloudy", "rainy", "cloudy"][i % 4], temperature: (type === "hourly" ? 50 : 38) + (i % 9) * 4, templow: 28 + (i % 5) * 5, precipitation_probability: (i * 13) % 100, wind_speed: 3 + (i * 7) % 18, wind_bearing: (i * 40) % 360 });
  return out;
}
var calls = [];
var hass = {
  states: states,
  config: { latitude: 44, longitude: -123, unit_system: { temperature: "°F" }, time_zone: "America/Los_Angeles" },
  user: { is_admin: true, name: "Test" },
  language: "en", locale: { language: "en" },
  callService: function (d, s, data) { calls.push([d, s, data]); return Promise.resolve(); },
  callWS: function (m) { calls.push(["ws", m.type]);
    if (m.type === "fire_event" && m.event_type === "kiosk_satellite_alarm") {
      var r = Object.assign({ id: m.event_data.id, kiosk: "Kitchen Echo Show 8" }, kiosk(m.event_data));
      setTimeout(function () { (listeners.kiosk_satellite_alarm_result || []).slice().forEach(function (cb) { cb({ event_type: "kiosk_satellite_alarm_result", data: r }); }); }, 250);
      return Promise.resolve({});
    } if (m.type === "lovelace/config") return Promise.resolve({ echo_notify: { sources: { nws: { enabled: false } } } }); return Promise.resolve({ children: [] }); },
  connection: {
    subscribeMessage: function (cb, msg) { if (msg.type === "weather/subscribe_forecast") setTimeout(function () { cb({ forecast: forecast(msg.forecast_type) }); }, 30); return Promise.resolve(function () {}); },
    subscribeEvents: function (cb, type) { (listeners[type] = listeners[type] || []).push(cb); return Promise.resolve(function () { listeners[type].splice(listeners[type].indexOf(cb), 1); return Promise.resolve(); }); },
    addEventListener: function () {},
  },
};
var buttons = [{ icon: "mdi:weather-partly-cloudy", navigation_path: "#weather" }, { icon: "mdi:clock-outline", navigation_path: "#timers", timers: ["timer.echo_timer_1", "timer.echo_timer_2", "timer.echo_timer_3"] }, { icon: "mdi:speaker-multiple", navigation_path: "#media" }, { icon: "mdi:lightbulb-group" }, { icon: "mdi:cog", action: "settings" }];
var CONFIGS = {
  weather: ["echo-weather-card", { sources: [{ entity: "weather.home", name: "Home" }], sunrise: "sensor.sun_next_rising", sunset: "sensor.sun_next_setting", animations: false, buttons: buttons }],
  timers: ["echo-clock-card", { buttons: buttons, alarm: false }],
  media: ["echo-media-card", { players: [{ name: "Kitchen", entity: "media_player.kitchen" }, { name: "Living Room", entity: "media_player.living_room" }], default_player: "media_player.kitchen", buttons: buttons, quick_favorites: 0 }],
};
var DASH = { echo_notify: { sound: true, sources: { nws: { enabled: false } } }, views: Object.keys(CONFIGS).map(function (k) { return { type: "panel", cards: [Object.assign({ type: "custom:" + CONFIGS[k][0] }, CONFIGS[k][1])] }; }) };
DASH.views[0].cards[0].sources.push({ name: "Backyard", temperature: "sensor.backyard" });
put(S("sensor.backyard", "57.2"));
var _ws = hass.callWS;
hass.callWS = function (m) { if (m.type === "lovelace/config") return Promise.resolve(DASH); return _ws(m); };
if (VIEW === "notify") {
  // echo-notify finds HA through <home-assistant>.hass, like in the real frontend.
  var ha = document.createElement("home-assistant"); ha.hass = hass; document.body.appendChild(ha);
  setTimeout(function () { window.echoNotify.show({ title: "Severe Thunderstorm Warning", severity: "severe", kicker: "Test", message: "This is a test notification.\n\nTap Dismiss to close it." }); }, 600);
} else {
  var c = CONFIGS[VIEW], card = document.createElement(c[0]);
  card.setConfig(c[1]);
  document.body.appendChild(card);
  card.hass = hass;
  window.card = card;
  if (TAB) setTimeout(function () {
    card._buttonTap(buttons[4]);
    setTimeout(function () { var p = document.querySelector("echo-show-settings"); var t = p && p.shadowRoot.querySelector('.tab[data-t="' + TAB + '"]'); if (t) t.click(); }, 300);
  }, 300);
}
</script></body></html>
