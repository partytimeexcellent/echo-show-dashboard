<!--
  Echo Show Dashboard as a Kiosk Satellite custom page (KS 2026.10.20+).

  Shows the cards of a Home Assistant dashboard without loading Home Assistant's own frontend:
  this page signs in with the dashboard's saved login (localStorage hassTokens), opens HA's
  WebSocket itself and hands the cards a small `hass` object. The views, card options and the
  echo_show / echo_notify blocks still come from the dashboard (default "echo-show").

  Install: copy to /config/www/echo-show.html, then on the display Settings > Home Assistant >
  Custom Pages > Add page, path /local/echo-show.html (another dashboard: ?dashboard=<url>).
  The part after # picks the view (#weather, #timers, ...); the cards' buttons switch views
  without a reload.

  Built from page/echo-show.html by build.js (icons from page/icons.json). Edit those, not dist/.
-->

<script>

  var conn = new Conn();

  // ---------- states (subscribe_entities, compressed) ----------
  var states = {}, dirty = false, flushT = null;
  function iso(sec) { return new Date(sec * 1000).toISOString(); }

  }

  var info = { config: null, services: null, user: null, entities: {}, devices: {}, areas: {}, locale: null };
  var dashP = null;
  function dashboardConfig() {
    if (!dashP) {

    }

  }
  function loadInfo() {
    var jobs = [
      conn.sendMessagePromise({ type: "get_config" }).then(function (c) { info.config = c; }),
      conn.sendMessagePromise({ type: "get_services" }).then(function (s) { info.services = s; }),
      conn.sendMessagePromise({ type: "auth/current_user" }).then(function (u) { info.user = u; }),
      conn.sendMessagePromise({ type: "frontend/get_user_data", key: "language" }).then(function (r) { info.userLocale = r && r.value; }, function () {}),
      conn.sendMessagePromise({ type: "config/entity_registry/list_for_display" }).then(function (r) {
        var out = {};
        (r && r.entities || []).forEach(function (e) {

      conn.sendMessagePromise({ type: "config/device_registry/list" }).then(function (r) {

      }, function () {}),
      conn.sendMessagePromise({ type: "config/area_registry/list" }).then(function (r) {

    if (params.bundle) return Promise.resolve(params.bundle);

    return conn.sendMessagePromise({ type: "lovelace/resources" }).then(function (list) {
      for (var i = 0; i < (list || []).length; i++) if (/echo-show-dashboard\.js/.test(list[i].url)) return list[i].url;
      return fallback;
    }, function () { return fallback; });
  }

    if (ready) {   // reconnected: the registries may have changed
      loadInfo().then(changed);
      return;

      var first = true;
      conn.subscribeMessage(function (ev) { onEntities(ev); if (first) { first = false; resolve(); } }, { type: "subscribe_entities" });
    });

      var cfg = r[0] || {};

      if (!views.length) { say("The dashboard “" + DASH + "” has no views."); return; }
      ready = true;
      buildHass();
      route();
    }, function (e) {
      say("Couldn't read the dashboard “" + DASH + "”: " + (e && e.message || e && e.code || e));
    });
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && conn.ready && conn.ws) {

      conn.ping().then(function () { clearTimeout(t); }, function () { clearTimeout(t); });
    }
  });
  conn.connect();
})();
