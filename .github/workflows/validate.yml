name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Bundle and Home Assistant files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: dist/ matches src/
        run: node build.js --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: YAML and Jinja
        run: |
          pip install pyyaml jinja2
          python3 test/validate_ha.py

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands
