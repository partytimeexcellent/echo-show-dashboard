name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Note package.json version
        run: echo "Releasing ${GITHUB_REF_NAME} (package.json version $(node -p "require('./package.json').version"))"
      - name: dist/ matches src/
        run: node build.js --check
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/echo-show-dashboard.js
          generate_release_notes: true
