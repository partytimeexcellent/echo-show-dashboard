blueprint:
  name: Echo Show timers - voice commands
  description: >-
    Voice start / pause / resume / cancel / status for the Echo Show timers, e.g.
    "set a 10 minute pasta timer", "how long is left on the pasta timer",
    "pause my timers", "stop" (silences a finished timer, or pauses the display's music
    when nothing is ringing). Each display controls its own timer set, picked from the
    voice satellite that heard the command. These sentences take priority over Assist's
    built-in timer intents.

    Create ONE automation from this blueprint and list every display in it.
    Needs the helpers and scripts from packages/echo_show.yaml and
    custom_templates/echo_timers.jinja from the Echo Show Dashboard repository.
  domain: automation
  source_url: https://github.com/partytimeexcellent/echo-show-dashboard/blob/main/homeassistant/blueprints/automation/echo_show/timer_voice.yaml
  input:
    displays:
      name: Displays
      description: >-
        One entry per Echo Show. satellite = its assist_satellite entity (how a command
        is matched to a display), timer_prefix = its timer set, media_player = its own
        media player (optional; "stop" pauses it when no timer is ringing),
        view_select = its Kiosk Satellite "Dashboard view" select (optional). The first
        entry is used when the satellite can't be identified.
      default:
        - satellite: assist_satellite.kitchen_echo_show_8
          timer_prefix: echo_timer
          media_player: media_player.kitchen_echo_show_8
          view_select: select.kitchen_echo_show_8_dashboard_view
      selector:
        object: {}
    timers_view:
      name: Timers view
      default: echo-show/timers
      selector:
        text: {}

mode: queued
max: 5

variables:
  displays: !input displays
  view: !input timers_view
  di: >-
    {% from 'echo_timers.jinja' import display_index %}{{ display_index(trigger.device_id if trigger.device_id is defined else none, displays) | int }}
  dsp: "{{ displays[di] if displays | count > di else {} }}"
  pfx: "{{ dsp.timer_prefix | default('echo_timer', true) }}"
  mp: "{{ dsp.media_player | default('', true) }}"
  vsel: "{{ dsp.view_select | default('', true) }}"
  act: "{{ trigger.id.split('_')[0] }}"
  all_flag: "{{ trigger.id.endswith('_all') }}"
  info: >-
    {% from 'echo_timers.jinja' import slots_json %}{{ slots_json(pfx) | from_json }}
  nm: >-
    {% from 'echo_timers.jinja' import clean_name %}{{ clean_name(trigger.slots.get('name', '')) | lower }}

trigger:
  - platform: conversation
    id: dismiss_all
    command:
      - "stop"
      - "dismiss"
      - "silence"
      - "quiet"
      - "shut up"
      - "okay stop"
      - "(stop|dismiss|silence|turn off|shut off|cancel) [the|that|my] alarm[s]"
      - "(dismiss|silence|shut off) [the|that|my] timer[s]"
      - "(stop|shut) (it|that) [off]"
  - platform: conversation
    id: start
    command:
      - "(start|set|create|make) [a|an] [new] {duration} timer (called|named|labeled) {name}"
      - "(start|set|create|make) [a|an] [new|another] timer (called|named|labeled) {name} for {duration}"
      - "(start|set|create|make) [a|an] [new|another] timer for {duration}"
      - "(start|set|create|make) [a|an] [new] {duration} timer"
      - "(start|set|create|make) another {duration} timer"
      - "(start|set|create|make) another {duration} timer (called|named|labeled) {name}"
      - "(start|set|create|make) [a|an] [new] {duration} {name} timer"
      - "timer for {duration}"
  - platform: conversation
    id: show
    command:
      - "(start|set|create|make) [a|an] [new] timer"
      - "(start|set|create|make) another timer"
      - "(add|new) [a] timer"
      - "show [me] [the|my] timers"
      - "open [the|my] timers"
  - platform: conversation
    id: status
    command:
      - "how (much time|long) [is] left"
      - "how (much time|long) [is] left on [the|my] timer[s]"
      - "how (much time|long) [is] left on [the|my] {name} timer"
      - "(what's|what is) [the] timer status"
      - "(check|status of) [the|my] timer[s]"
  - platform: conversation
    id: pause_all
    command:
      - "pause all [the|my|of the] timers"
      - "pause [the|my] timers"
  - platform: conversation
    id: resume_all
    command:
      - "(resume|unpause|continue) all [the|my|of the] timers"
      - "(resume|unpause|continue) [the|my] timers"
  - platform: conversation
    id: cancel_all
    command:
      - "(cancel|stop|delete|clear|dismiss|end|remove) all [the|my|of the] timers"
      - "(cancel|stop|delete|clear|dismiss|end|remove) [the|my] timers"
  - platform: conversation
    id: pause
    command:
      - "pause [the|my] timer"
      - "pause [the|my] {name} timer"
  - platform: conversation
    id: resume
    command:
      - "(resume|unpause|continue|restart) [the|my] timer"
      - "(resume|unpause|continue|restart) [the|my] {name} timer"
  - platform: conversation
    id: cancel
    command:
      - "(cancel|stop|delete|clear|dismiss|end|remove|silence|turn off) [the|my] timer"
      - "(cancel|stop|delete|clear|dismiss|end|remove|silence|turn off) [the|my] {name} timer"

action:
  - choose:
      # ---- start a timer ----
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - variables:
              d_raw: "{{ trigger.slots.get('duration', '') }}"
              n_raw: >-
                {% set d = trigger.slots.get('duration', '') %}{% set n = trigger.slots.get('name', '') %}{% if not n and (' called ' in d or ' named ' in d) %}{{ d.split(' called ')[-1].split(' named ')[-1] }}{% else %}{{ n }}{% endif %}
          - variables:
              secs: >-
                {% from 'echo_timers.jinja' import timer_seconds %}{{ timer_seconds(d_raw.split(' called ')[0].split(' named ')[0]) | int }}
              tname: >-
                {% from 'echo_timers.jinja' import clean_name %}{{ clean_name(n_raw) }}
          - if:
              - condition: template
                value_template: "{{ secs | int > 0 }}"
            then:
              - action: script.echo_timer_start
                data:
                  duration: "{{ secs }}"
                  name: "{{ tname }}"
                  prefix: "{{ pfx }}"
                  navigate: true
                  view_select: "{{ vsel }}"
                  view: "{{ view }}"
                response_variable: r
              - set_conversation_response: >-
                  {% from 'echo_timers.jinja' import speak_duration %}{% if r.ok %}{{ (tname ~ ' timer' if tname else 'Timer') }} set for {{ speak_duration(secs) }}.{% elif r.reason == 'full' %}You already have three timers going.{% else %}Sorry, I didn't catch how long.{% endif %}
            else:
              - if:
                  - condition: template
                    value_template: "{{ vsel != '' }}"
                then:
                  - action: select.select_option
                    continue_on_error: true
                    target:
                      entity_id: "{{ vsel }}"
                    data:
                      option: "{{ view }}"
              - set_conversation_response: Sorry, how long? You can also set it on the screen.

      # ---- "set a timer" without a duration: show the timers page ----
      - conditions:
          - condition: trigger
            id: show
        sequence:
          - if:
              - condition: template
                value_template: "{{ vsel != '' }}"
            then:
              - action: select.select_option
                continue_on_error: true
                target:
                  entity_id: "{{ vsel }}"
                data:
                  option: "{{ view }}"
          - set_conversation_response: >-
              {{ 'You already have three timers going.' if info | count >= 3 else 'How long? Say, for example, start a 10 minute timer, or set it on the screen.' }}

      # ---- how long is left ----
      - conditions:
          - condition: trigger
            id: status
        sequence:
          - set_conversation_response: >-
              {% from 'echo_timers.jinja' import speak_duration, remaining_secs %}{% set ns = namespace(o=[]) %}{% for x in info %}{% if not nm or nm in (x.n | lower) %}{% set lbl = ('the ' ~ x.n ~ ' timer') if x.n != 'Timer' else ('timer ' ~ loop.index if info | count > 1 else 'your timer') %}{% if x.s == 'done' %}{% set ns.o = ns.o + [lbl[:1] | upper ~ lbl[1:] ~ ' is done'] %}{% else %}{% set ns.o = ns.o + [speak_duration(remaining_secs(x.i, pfx)) ~ ' left on ' ~ lbl ~ (', paused' if x.s == 'paused' else '')] %}{% endif %}{% endif %}{% endfor %}{{ (ns.o | join('. ') ~ '.') if ns.o else ("You don't have any timers." if not nm else "I couldn't find a " ~ nm ~ ' timer.') }}

    # ---- pause / resume / cancel / dismiss ----
    default:
      - variables:
          targets: >-
            {% set want = {'pause': ['active'], 'resume': ['paused'], 'cancel': ['active', 'paused', 'done'], 'dismiss': ['done']}[act] %}{% set c = info | selectattr('s', 'in', want) | list %}{% if all_flag or nm == 'all' %}{{ c | map(attribute='i') | list }}{% elif nm %}{% set ns = namespace(ex=[], part=[]) %}{% for x in c %}{% if (x.n | lower) == nm %}{% set ns.ex = ns.ex + [x.i] %}{% elif nm in (x.n | lower) or (x.n | lower) in nm %}{% set ns.part = ns.part + [x.i] %}{% endif %}{% endfor %}{{ (ns.ex + ns.part)[:1] }}{% elif c | count == 0 %}{{ [] }}{% else %}{% set d = c | selectattr('s', 'eq', 'done') | list %}{% set a = c | selectattr('s', 'eq', 'active') | sort(attribute='f') | list %}{{ [d[0].i] if (act == 'cancel' and d) else [(a[0] if a else c[0]).i] }}{% endif %}
      - set_conversation_response: >-
          {% from 'echo_timers.jinja' import timer_label %}{% set verb = {'pause': 'Paused', 'resume': 'Resumed', 'cancel': 'Cancelled', 'dismiss': 'Dismissed'}[act] %}{% if targets | count == 0 %}{{ ({'pause': "There's no running timer to pause.", 'resume': "There's no paused timer to resume.", 'cancel': "There's no timer to cancel.", 'dismiss': ('Stopped.' if (mp and is_state(mp, 'playing')) else 'No timer is going off.')}[act]) if (not nm or nm == 'all') else "I couldn't find a " ~ nm ~ ' timer.' }}{% elif targets | count > 1 %}{{ verb }} all timers.{% else %}{% set x = info | selectattr('i', 'eq', targets[0]) | first %}{{ ('Dismissed' if x.s == 'done' else verb) ~ ' ' ~ timer_label(x.n) ~ '.' }}{% endif %}
      - alias: Plain "stop" with nothing ringing pauses the display's music instead
        if:
          - condition: template
            value_template: "{{ act == 'dismiss' and targets | count == 0 and mp != '' and is_state(mp, 'playing') }}"
        then:
          - action: media_player.media_pause
            target:
              entity_id: "{{ mp }}"
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ act == 'pause' }}"
                  sequence:
                    - action: timer.pause
                      target:
                        entity_id: "timer.{{ pfx }}_{{ repeat.item }}"
                - conditions:
                    - condition: template
                      value_template: "{{ act == 'resume' }}"
                  sequence:
                    - action: timer.start
                      target:
                        entity_id: "timer.{{ pfx }}_{{ repeat.item }}"
                - conditions:
                    - condition: template
                      value_template: "{{ act in ['cancel', 'dismiss'] }}"
                  sequence:
                    - action: script.echo_timer_cancel
                      data:
                        slot: "{{ repeat.item }}"
                        prefix: "{{ pfx }}"
