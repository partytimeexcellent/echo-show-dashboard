blueprint:
  name: Echo Show timers - alarm when finished
  description: >-
    When one of a display's three Echo Show timers finishes: wake its screen, switch it to
    the timers view and raise its volume to the alarm level. The timers page itself rings
    until the timer is dismissed (on screen or by voice), then the volume goes back to
    what it was.

    Leave "Timer set" empty and ONE automation covers every display: a timer named
    timer.<display>_timer_N belongs to the display whose Kiosk Satellite name slugifies to
    <display>, and that display's volume, screensaver button and view select are found by
    name. Or fill the inputs in to handle one timer set only.

    Needs the helpers from packages/echo_show.yaml and
    custom_templates/echo_timers.jinja from the Echo Show Dashboard repository.
  domain: automation
  source_url: https://github.com/partytimeexcellent/echo-show-dashboard/blob/main/homeassistant/blueprints/automation/echo_show/timer_alarm.yaml
  input:
    timer_prefix:
      name: Timer set
      description: >-
        Prefix of one display's timers (timer.<prefix>_1..3). Empty: every display's own
        set (timer.<display>_timer_N) and the shared echo_timer set.
      default: ""
      selector:
        text: {}
    volume_entity:
      name: Display volume
      description: The Kiosk Satellite volume number of this display (number.*_volume). Empty finds it by name.
      default: []
      selector:
        entity:
          domain: number
    screensaver_button:
      name: Postpone-screensaver button (optional)
      description: Kiosk Satellite button that wakes the screen.
      default: []
      selector:
        entity:
          domain: button
    view_select:
      name: Dashboard-view select (optional)
      description: Kiosk Satellite "Dashboard view" select, used to open the timers view.
      default: []
      selector:
        entity:
          domain: select
    timers_view:
      name: Timers view
      default: echo-show/timers
      selector:
        text: {}
    alarm_volume:
      name: Alarm volume helper
      default: input_number.echo_timer_alarm_volume
      selector:
        entity:
          domain: input_number

mode: parallel
max: 10

variables:
  pfx_in: !input timer_prefix
  vol_in: !input volume_entity
  btn_in: !input screensaver_button
  sel_in: !input view_select
  view: !input timers_view
  alarm_vol: !input alarm_volume
  tid: "{{ trigger.event.data.entity_id if trigger is defined and trigger.event is defined else '' }}"
  pfx: "{{ pfx_in if pfx_in else (tid.split('.')[1] | default('') | regex_replace('_[123]$', '')) }}"
  slug: >-
    {% from 'echo_timers.jinja' import slug_for_prefix %}{{ slug_for_prefix(pfx) }}
  vol: >-
    {% from 'echo_timers.jinja' import display_entity %}{{ vol_in if vol_in else display_entity(slug, 'number', 'volume') }}
  btn: >-
    {% from 'echo_timers.jinja' import display_entity %}{{ btn_in if btn_in else display_entity(slug, 'button', 'postpone_screensaver') }}
  sel: >-
    {% from 'echo_timers.jinja' import display_entity %}{{ sel_in if sel_in else display_entity(slug, 'select', 'dashboard_view') }}

trigger:
  - platform: event
    event_type: timer.finished

condition:
  - condition: template
    value_template: >-
      {% if pfx_in %}{{ tid in ['timer.' ~ pfx ~ '_1', 'timer.' ~ pfx ~ '_2', 'timer.' ~ pfx ~ '_3'] }}
      {%- else -%}{{ tid is match('timer\\..+_[123]$') and (pfx == 'echo_timer' or (pfx.endswith('_timer') and states('timer.' ~ pfx ~ '_1') != 'unknown')) }}{% endif %}

action:
  # Remembered for this run only. A second timer of the same set that finishes while the
  # first still rings finds the alarm volume already set and leaves restoring to the first run.
  - variables:
      saved_volume: "{{ states(vol) | float(none) if vol and states(vol) | float(-1) != states(alarm_vol) | float(100) else none }}"
  - if:
      - condition: template
        value_template: "{{ vol | length > 0 }}"
    then:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ vol }}"
        data:
          value: "{{ states(alarm_vol) | float(100) }}"
  - if:
      - condition: template
        value_template: "{{ btn | length > 0 }}"
    then:
      - action: button.press
        continue_on_error: true
        target:
          entity_id: "{{ btn }}"
  - if:
      - condition: template
        value_template: "{{ sel | length > 0 }}"
    then:
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: "{{ sel }}"
        data:
          option: "{{ view }}"
  - alias: Wait until every finished timer of this set has been dismissed
    repeat:
      sequence:
        - wait_template: >-
            {% from 'echo_timers.jinja' import slots_json %}{{ (slots_json(pfx) | from_json | selectattr('s', 'eq', 'done') | list | count) == 0 }}
          timeout:
            minutes: 30
          continue_on_timeout: true
      until:
        - condition: template
          value_template: >-
            {% from 'echo_timers.jinja' import slots_json %}{{ (slots_json(pfx) | from_json | selectattr('s', 'eq', 'done') | list | count) == 0 or repeat.index >= 8 }}
  - if:
      - condition: template
        value_template: "{{ vol | length > 0 and saved_volume is not none }}"
    then:
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: "{{ vol }}"
        data:
          value: "{{ saved_volume }}"
