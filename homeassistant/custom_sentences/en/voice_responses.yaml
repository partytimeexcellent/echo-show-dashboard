# Natural spoken answers for Assist ("74 degrees", not "73.688 °F").
# Copy to <config>/custom_sentences/en/ and custom_templates/voice.jinja to
# <config>/custom_templates/, then restart Home Assistant (or reload Conversation).
# Only these answers change; every other answer of these intents keeps Home Assistant's own.
language: en

# "What's the temperature?" with no room names the satellite's own room, and fails (handing the
# question to the AI agent) when that room has no thermostat. These send it to the house thermostat.
intents:
  HassClimateGetTemperature:
    data:
      - sentences:
          - "(what's|what is) the temperature [inside|in here|in the house]"
          - "how (warm|cold|hot) is it (inside|in here|in the house)"
          - "(what's|what is) it (inside|in the house)"
        slots:
          name: Thermostat  # <-- your thermostat's name

responses:
  intents:
    # "What's the bedroom temperature?", "What is the humidity in the kitchen?"
    HassGetState:
      default: "{% from 'voice.jinja' import say_state %}{{ say_state(state.entity_id) }}"
      one: "{% from 'voice.jinja' import say_state %}{{ slots.name | capitalize }} is {{ say_state(state.entity_id) }}"
      one_yesno: >-
        {% from 'voice.jinja' import say_state %}
        {% if query.matched %}Yes{% else %}No, {{ say_state(state.entity_id) }}{% endif %}

    # "What's the weather?"
    HassGetWeather:
      default: "{% from 'voice.jinja' import say_weather %}{{ say_weather(state.entity_id) }}"

    # "What's the temperature in the living room?" (thermostat)
    HassClimateGetTemperature:
      default: "{% from 'voice.jinja' import say_climate %}{{ say_climate(state.entity_id) }}"

    # "Set the thermostat to 72"
    HassClimateSetTemperature:
      default: "{% from 'voice.jinja' import say_value %}Thermostat set to {{ say_value(slots.temperature, '°') }}"
