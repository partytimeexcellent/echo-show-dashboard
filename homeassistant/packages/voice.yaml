# "What's the temperature?" answered from the room you're in.
# Asked on a display, Assist reads that room's temperature sensor (or thermostat), else the other
# rooms on its floor, else the house thermostat. "In the <room>" / "<floor>" asks for that room or floor. Needs
# custom_templates/voice.jinja. Without this, Home Assistant only looks for a thermostat in the
# room and hands the question to the AI agent when there is none.
automation:
  - id: voice_room_temperature
    alias: "Voice: room temperature"
    description: "Answers \"what's the temperature\" from the room's own sensor, else the thermostat."
    mode: parallel
    triggers:
      - trigger: conversation
        command:
          - "(what's|what is) the temperature [in here|inside|in this room]"
          - "how (warm|cold|hot) is it (in here|inside|in this room)"
          - "(what's|what is) the temperature in [the] {area}"
          - "how (warm|cold|hot) is it in [the] {area}"
          - "(what's|what is) the temperature {area}"
          - "how (warm|cold|hot) is it {area}"
    actions:
      - variables:
          asked: >-
            {{ trigger.slots.area | default('') | lower | trim
               | regex_replace('^(in|on)\s+', '') | regex_replace('^the\s+', '') }}
          here: "{{ (area_id(trigger.device_id) or '') if trigger.device_id else '' }}"
      - variables:
          room: "{{ (area_id(asked) or '') if asked else here }}"
          floor: "{{ (floor_id(asked) or '') if asked else '' }}"
      - variables:
          answer: >-
            {% from 'voice.jinja' import say_room_temperature, say_weather %}
            {% set w = states.weather | map(attribute='entity_id') | first | default('') %}
            {% if asked in ['outside', 'outdoors'] and w %}It's {{ say_weather(w) }} outside.
            {% elif asked and not room and not floor %}I don't know a room called {{ asked }}.
            {% else %}{{ say_room_temperature(room, floor) }}{% endif %}
      - set_conversation_response: "{{ answer }}"
