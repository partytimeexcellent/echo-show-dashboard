# Echo Show Dashboard: helpers
# https://github.com/partytimeexcellent/echo-show-dashboard
#
# Install:
#   1. Make sure configuration.yaml loads packages:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Copy this file to <config>/packages/echo_show.yaml
#   3. Restart Home Assistant.
#
# Timers are Kiosk Satellite's own (2026.10.14 or later, Voice Satellite running natively):
# the dashboard reads and changes each display's timers through its esphome.<node>_vs_*
# actions and needs no timer helpers. The alarm volume below is what the "Timer finished"
# blueprint (blueprints/automation/echo_show/timer_finished.yaml) turns a display up to
# while a timer rings; the settings panel's Timers tab sets it.
#
# The media card's shared queue helpers (input_text.echo_media_src_<room>) are only
# needed if you use the media card WITHOUT a direct Music Assistant connection. Add one
# per room, named after the room's `name:` in the card (e.g. "Living Room" ->
# echo_media_src_living_room).

input_number:
  echo_timer_alarm_volume:
    name: Echo Timer Alarm Volume
    icon: mdi:alarm-light-outline
    min: 10
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider

# input_text:
